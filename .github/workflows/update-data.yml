name: Atualizar dados · toda sexta às 12h (Brasília)

on:
  schedule:
    - cron: '0 15 * * 5'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Gerar data.json
        env:
          SHEETDB_URL: ${{ secrets.SHEETDB_URL }}
          SHEET_NAME: Trustpilot
        run: python3 scripts/generate_data.py

      - name: Commit e push se houve mudanças
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Sem mudanças em data.json — nada a commitar."
          else
            git commit -m "chore: atualiza data.json $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
